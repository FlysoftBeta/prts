[package]
name = "prtsd"
version = "0.1.0"
edition = "2024"
default-run = "prtsd"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1"
bytes = "1"
font8x8 = "0.3.1"
openh264 = "0.9.9"
openh264-sys2 = "0.9.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }
url = "2.5.8"
webrtc = "0.21.1"
rtc = { version = "0.21.1", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_System_JobObjects", "Win32_System_Memory", "Win32_System_Threading", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Ole", "Win32_Security", "Win32_System_Pipes", "Win32_System_IO", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility"] }
